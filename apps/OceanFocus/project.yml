name: OceanFocus
options:
  bundleIdPrefix: ai.muum
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
packages:
  OceanFocusCore:
    path: ../../OceanFocusCore
targets:
  OceanFocusMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Shared
      - path: Resources/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: OceanFocusCore
    info:
      path: Mac/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Ocean Focus
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: "© 2026 Murat Umutlu"
    settings:
      base:
        PRODUCT_NAME: Ocean Focus
        PRODUCT_BUNDLE_IDENTIFIER: ai.muum.oceanfocus
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: NO
  OceanFocusiOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
      - path: Resources/web
        type: folder
        buildPhase: resources
    dependencies:
      - package: OceanFocusCore
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Ocean Focus
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_NAME: Ocean Focus
        PRODUCT_BUNDLE_IDENTIFIER: ai.muum.oceanfocus
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
